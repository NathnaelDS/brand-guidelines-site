# The site is built locally (it needs the brand library and image tools), and dist/ is committed.
# Netlify only publishes it.
[build]
  publish = "dist"
  command = ""

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/tokens.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
